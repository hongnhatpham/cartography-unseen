<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapping the Blackbox · Journey</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif;background:#000;color:#e3e6e4}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}canvas:focus-visible{outline:1px solid #d5ddd8;outline-offset:-3px}header{position:fixed;top:28px;left:32px;pointer-events:none}h1{font-size:24px;font-weight:500;letter-spacing:-.7px;margin:0 0 8px}small,#status{font-size:12px;color:#aeb5b2}nav{position:fixed;top:28px;right:28px;display:flex;gap:6px;flex-wrap:wrap;max-width:50%;justify-content:end}button,.file,select{background:#111b;border:1px solid #5559;color:#e3e6e4;font:inherit;font-size:13px;padding:9px 12px;cursor:pointer}button:hover,.file:hover{background:#28312a}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}button[aria-pressed=true]{background:#d8dfda;color:#111}#details{position:fixed;bottom:100px;left:32px;max-width:min(570px,calc(100vw - 64px));max-height:35vh;overflow:auto;background:#000c;padding:14px 18px;border-left:1px solid #b7c1bb}#details:empty{display:none}#details p{line-height:1.5;margin:8px 0}#timeline{position:fixed;top:auto;max-width:none;justify-content:flex-start;flex-wrap:nowrap;bottom:44px;left:32px;right:32px;display:flex;gap:7px;overflow:auto;padding:5px 0}#timeline button{white-space:nowrap}footer{position:fixed;bottom:15px;left:32px;color:#969f99;font-size:12px;pointer-events:none}input{display:none}dialog{border:1px solid #555;background:#0b0c0b;color:#eee;max-width:95vw;max-height:95vh}dialog::backdrop{background:#000d}dialog img{display:block;max-width:85vw;max-height:72vh;object-fit:contain;margin:12px 0}dialog a{color:#ddd;float:right}#error{position:fixed;top:40%;left:10%;right:10%;text-align:center;color:#ddd;line-height:1.7} @media(max-width:650px){header{top:18px;left:18px}h1{font-size:20px}nav{top:95px;left:18px;right:auto;max-width:95%}#timeline{left:18px;right:18px}#details{left:18px;max-height:30vh}footer{left:18p </style>
<canvas id="map" tabindex="0" aria-label="3D journey map. Arrow keys orbit, plus and minus zoom, Home fits the journey. Select a prompt below to locate it."></canvas>
<header><h1>Mapping the Blackbox</h1><div id="status">Opening journey…</div></header>
<nav aria-label="Map controls"><button id="orbit" aria-pressed="false">Orbit</button><button id="fit">Fit journey</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="openArchive">Open archive</button><input id="files" type="file" webkitdirectory multiple><select id="viewList" aria-label="Inspect an original view"><option value="">Inspect a view</option></select></nav>
<div id="error" role="status"></div><section id="details" aria-live="polite"></section><nav id="timeline" aria-label="Prompt changes"></nav>
<footer>Drag to orbit · Shift / right drag to pan · Scroll / pinch to zoom · Select an image for its original</footer>
<dialog id="imageDialog"><button id="closeImage">Close image</button><a id="original" target="_blank" rel="noopener">Open original image</a><img id="imagePreview" alt="Generated view from the recorded journey"><p id="imageInfo"></p></dialog>
<script>/* JOURNEY_MANIFEST */</script>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('map'), gl=canvas.getContext('webgl',{antialias:true,alpha:false});
let manifest,origin=[0,0,0],target=[0,0,0],yaw=.7,pitch=.6,distance=90,auto=false,dirty=true,last=0,geometry=[],textures=new Map(),urls=new Map(),imageNodes=[],promptNodes=[],mvp,selected=null;
const add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,k)=>a.map(x=>x*k),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/(Math.hypot(...a)||1));
function multiply(a,b){let c=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)c[j*4+i]+=a[k*4+i]*b[j*4+k];return c}
function camera(){let eye=add(target,[Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance]),z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x),v=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]),f=1/Math.tan(Math.PI/7),near=.02,far=Math.max(10000,distance*20),p=new Float32Array([f/(canvas.width/canvas.height),0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);return multiply(p,v)}
function shader(type,source){let s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let program,loc;
function setup(){if(!gl)throw Error('This browser could not start WebGL. Try a browser with hardware graphics enabled.');program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec2 uv;uniform mat4 mvp;varying vec2 t;void main(){gl_Position=mvp*vec4(p,1.);gl_PointSize=9.;t=uv;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 t;uniform sampler2D image;uniform bool textured;uniform vec4 color;void main(){gl_FragColor=textured?texture2D(image,t)*color:color;}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);loc={p:gl.getAttribLocation(program,'p'),uv:gl.getAttribLocation(program,'uv'),mvp:gl.getUniformLocation(program,'mvp'),textured:gl.getUniformLocation(program,'textured'),color:gl.getUniformLocation(program,'color')};gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(0,0,0,1)}
function buffer(points,mode,uvs,item){const b=gl.createBuffer(),data=[];points.forEach((p,i)=>data.push(...p,...(uvs?.[i]||[0,0])));gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);let node={b,count:points.length,mode,item};geometry.push(node);return node}
function corners(image){const [p,y,r]=(image.rotation||[0,0,0]).map(x=>x*Math.PI/180),forward=[Math.sin(y)*Math.cos(p),Math.sin(p),-Math.cos(y)*Math.cos(p)],right=[Math.cos(y),0,Math.sin(y)],up=cross(right,forward),rx=add(mul(right,Math.cos(r)),mul(up,Math.sin(r))),uy=sub(mul(up,Math.cos(r)),mul(right,Math.sin(r))),w=(image.plane_width||8)/2,h=w*(image.height||1)/(image.width||1),c=sub(image.position,origin);return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([x,y])=>add(c,add(mul(rx,x*w),mul(uy,y*h))))}
function imageURL(item){return urls.get(item.path)||item.path}
function loadTexture(node){let item=node.item,key=item.id;if(textures.has(key))return;let entry={texture:null,loading:true};textures.set(key,entry);const img=new Image();img.onload=()=>{if(textures.get(key)!==entry)return;let texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);const limit=Math.min(1024,gl.getParameter(gl.MAX_TEXTURE_SIZE)),scale=Math.min(1,limit/img.width,limit/img.height),thumb=document.createElement('canvas');thumb.width=Math.max(1,Math.round(img.width*scale));thumb.height=Math.max(1,Math.round(img.height*scale));thumb.getContext('2d').drawImage(img,0,0,thumb.width,thumb.height);try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,thumb);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);entry.texture=texture}catch(error){gl.deleteTexture(texture);$('error').textContent='To view local image planes, choose Open archive and select this archive folder.'}entry.loading=false;dirty=true};img.onerror=()=>{entry.loading=false;entry.failed=true};img.src=imageURL(item)}
function workingSet(){if(!manifest)return;let nearest=[...imageNodes].sort((a,b)=>Math.hypot(...sub(sub(a.item.position,origin),target))-Math.hypot(...sub(sub(b.item.position,origin),target))).slice(0,128),wanted=new Set(nearest.map(n=>n.item.id));for(const [key,entry]of textures){if(!wanted.has(key)){if(entry.texture)gl.deleteTexture(entry.texture);textures.delete(key)}}nearest.forEach(loadTexture)}
function fit(){if(!manifest)return;const points=manifest.segments.flatMap(s=>s.points.map(p=>sub(p.position,origin))).concat(manifest.images.map(i=>sub(i.position,origin)));if(!points.length)points.push([0,0,0]);let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of points)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i])}target=mul(add(lo,hi),.5);distance=Math.max(35,Math.hypot(...sub(hi,lo))*1.05)/Math.min(1,canvas.clientWidth/Math.max(1,canvas.clientHeight));dirty=true;workingSet()}
function timeLabel(time){return Math.max(0, Number(time||0)-Number(manifest?.started_monotonic||0)).toFixed(1)+' s'}
function showPrompt(prompt,button){selected=prompt.id;target=sub(prompt.position,origin);distance=Math.min(distance,75);$('details').replaceChildren();const meta=document.createElement('small');meta.textContent='PROMPT '+prompt.revision+' · '+timeLabel(prompt.timestamp)+' · '+prompt.trigger+(prompt.active?'':' · Automatic flight');const text=document.createElement('p');text.textContent=prompt.prompt;const coords=document.createElement('small');coords.textContent='X '+prompt.position[0].toFixed(2)+'   Y '+prompt.position[1].toFixed(2)+'   Z '+prompt.position[2].toFixed(2);$('details').append(meta,text,coords);for(const b of $('timeline').children)b.setAttribute('aria-pressed',String(b===button));dirty=true;workingSet()}
function install(data){if(!data||!Array.isArray(data.segments)||!Array.isArray(data.images)||!Array.isArray(data.prompts))throw Error('This file is not a journey manifest.');manifest=data;origin=data.segments[0]?.points[0]?.position||data.images[0]?.position||[0,0,0];geometry.forEach(n=>gl.deleteBuffer(n.b));geometry=[];imageNodes=[];promptNodes=[];textures.forEach(e=>{if(e.texture)gl.deleteTexture(e.texture)});textures.clear();data.segments.forEach(s=>{if(s.points.length>1)buffer(s.points.map(p=>sub(p.position,origin)),gl.LINE_STRIP)});data.images.forEach(item=>imageNodes.push(buffer(corners(item),gl.TRIANGLE_FAN,[[0,0],[1,0],[1,1],[0,1]],item)));data.prompts.filter(item=>item.active).forEach(item=>promptNodes.push(buffer([sub(item.position,origin)],gl.POINTS,null,item)));$('timeline').replaceChildren();data.prompts.forEach(p=>{let b=document.createElement('button');b.textContent='P'+p.revision+' · '+timeLabel(p.timestamp);b.title=p.prompt;b.setAttribute('aria-pressed','false');b.onclick=()=>showPrompt(p,b);$('timeline').append(b)});$('viewList').replaceChildren(new Option('Inspect a view',''));data.images.forEach((item,index)=>$('viewList').add(new Option('View '+item.sequence+' ? '+timeLabel(item.timestamp),String(index))));$('status').textContent=data.images.length+' views · '+data.prompts.length+' prompts · '+(data.id||'Recorded journey');$('error').textContent='';$('details').replaceChildren();fit();dirty=true}
function project(p){let v=[...sub(p,origin),1],q=[0,0,0,0];for(let i=0;i<4;i++)for(let j=0;j<4;j++)q[i]+=mvp[j*4+i]*v[j];return q[3]>0?[(q[0]/q[3]+1)*canvas.clientWidth/2,(1-q[1]/q[3])*canvas.clientHeight/2]:null}
function showImage(item){$('imagePreview').src=imageURL(item);$('original').href=imageURL(item);$('imageInfo').textContent='View '+item.sequence+' ? '+timeLabel(item.timestamp)+' ? Prompt '+item.prompt_revision+' ? Original '+item.width+' ? '+item.height;$('imageDialog').showModal()}
function pick(x,y){if(!manifest||!mvp)return;let event=null,eventDistance=14;manifest.prompts.forEach((item,index)=>{if(!item.active)return;const q=project(item.position);if(q){const d=Math.hypot(q[0]-x,q[1]-y);if(d<eventDistance){eventDistance=d;event={item,index}}}});if(event){showPrompt(event.item,$('timeline').children[event.index]);return}let best=null,nearest=30;for(const item of manifest.images){let q=project(item.position);if(q){let d=Math.hypot(q[0]-x,q[1]-y);if(d<nearest){nearest=d;best=item}}}if(best)showImage(best)}
function draw(now){requestAnimationFrame(draw);if(document.hidden||now-last<1000/30)return;let dt=Math.min((now-last)/1000,.1);last=now;if(auto){yaw+=dt*Math.PI*2/180;dirty=true}if(!dirty)return;dirty=false;let ratio=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);mvp=camera();gl.uniformMatrix4fv(loc.mvp,false,mvp);for(const node of geometry){gl.bindBuffer(gl.ARRAY_BUFFER,node.b);gl.enableVertexAttribArray(loc.p);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(loc.uv);gl.vertexAttribPointer(loc.uv,2,gl.FLOAT,false,20,12);const texture=node.item&&node.mode!==gl.POINTS?textures.get(node.item.id)?.texture:null;gl.uniform1i(loc.textured,!!texture);gl.uniform4fv(loc.color,texture?[1,1,1,1]:node.mode===gl.POINTS?[.95,.94,.83,1]:[.52,.58,.54,.8]);if(texture)gl.bindTexture(gl.TEXTURE_2D,texture);if(node.mode===gl.POINTS)gl.disable(gl.DEPTH_TEST);gl.drawArrays(node.mode===gl.TRIANGLE_FAN&&!texture?gl.LINE_LOOP:node.mode,0,node.count);if(node.mode===gl.POINTS)gl.enable(gl.DEPTH_TEST)}}
let pointers=new Map(),down=null,pinch=0;
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);down=[e.clientX,e.clientY];if(pointers.size===2){let p=[...pointers.values()];pinch=Math.hypot(...sub(p[0],p[1]))}};
canvas.onpointermove=e=>{const prev=pointers.get(e.pointerId);if(!prev)return;const dx=e.clientX-prev[0],dy=e.clientY-prev[1];pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let p=[...pointers.values()],n=Math.hypot(...sub(p[0],p[1]));if(n>0)distance=Math.max(2,distance*pinch/n);pinch=n}else if(e.shiftKey||e.buttons===2){target=add(target,[(-dx*Math.cos(yaw)+dy*Math.sin(yaw))*distance/600,dy*distance/700,(dx*Math.sin(yaw)+dy*Math.cos(yaw))*distance/600])}else{yaw-=dx*.006;pitch=Math.max(-1.45,Math.min(1.45,pitch+dy*.006))}dirty=true};
canvas.onpointerup=e=>{if(pointers.size===1&&down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5)pick(e.clientX,e.clientY);pointers.delete(e.pointerId);down=null;workingSet()};canvas.onpointercancel=e=>{pointers.delete(e.pointerId);down=null};canvas.oncontextmenu=e=>e.preventDefault();canvas.onwheel=e=>{e.preventDefault();distance=Math.max(2,Math.min(1e8,distance*Math.exp(e.deltaY*.001)));dirty=true};
function toggleOrbit(){auto=!auto;$('orbit').setAttribute('aria-pressed',String(auto));dirty=true}
$('openArchive').onclick=()=>$('files').click();$('viewList').onchange=e=>{if(e.target.value!==''&&manifest)showImage(manifest.images[Number(e.target.value)]);e.target.value=''};$('orbit').onclick=toggleOrbit;$('fit').onclick=fit;$('zoomIn').onclick=()=>{distance=Math.max(2,distance*.8);dirty=true};$('zoomOut').onclick=()=>{distance*=1.25;dirty=true};$('closeImage').onclick=()=>$('imageDialog').close();canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','=','Home',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')yaw-=.12;if(e.key==='ArrowRight')yaw+=.12;if(e.key==='ArrowUp')pitch=Math.min(1.45,pitch+.1);if(e.key==='ArrowDown')pitch=Math.max(-1.45,pitch-.1);if(e.key==='+'||e.key==='=')distance=Math.max(2,distance*.8);if(e.key==='-')distance*=1.25;if(e.key==='Home')fit();if(e.key===' ')toggleOrbit();dirty=true};
async function openFiles(files){let list=[...files],file=list.find(f=>f.name==='manifest.json');if(!file)throw Error('Select the archive folder containing manifest.json and images.');urls.forEach(URL.revokeObjectURL);urls.clear();const prefix=(file.webkitRelativePath||'').replace(/manifest\.json$/,'');for(const f of list){let path=(f.webkitRelativePath||f.name);if(path.startsWith(prefix))path=path.slice(prefix.length);urls.set(path,URL.createObjectURL(f))}install(JSON.parse(await file.text()))}
$('files').onchange=e=>openFiles(e.target.files).catch(e=>$('error').textContent=e.message);window.onresize=()=>{dirty=true};document.addEventListener('visibilitychange',()=>{dirty=true});
try{setup();requestAnimationFrame(draw);if(window.JOURNEY_MANIFEST)install(window.JOURNEY_MANIFEST);else fetch('manifest.json').then(r=>{if(!r.ok)throw Error('Missing manifest.json');return r.json()}).then(install).catch(()=>{$('status').textContent='Recorded journey';$('error').textContent='Choose Open archive and select a saved journey folder. On a website, keep this page beside manifest.json and the images folder.'})}catch(error){$('error').textContent=error.message}
</script></html>
